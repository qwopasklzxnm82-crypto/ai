<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 학습 어시스턴트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1c2541;
    --ink-soft: #4a5578;
    --paper: #eef1f8;
    --paper-2: #e2e7f5;
    --card: #ffffff;
    --accent: #0ea5a0;
    --accent-soft: #d7f3ee;
    --line: #dfe4f1;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(14, 165, 160, 0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(14, 165, 160, 0.08), transparent 45%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 32px);
    position: relative;
    overflow: hidden;
  }

  /* ambient background dot grid */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(28, 37, 65, 0.07) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 65% 60% at 50% 45%, #000 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 65% 60% at 50% 45%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  /* soft blurred blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
    opacity: 0.55;
    z-index: 0;
  }
  .blob-1 { width: 260px; height: 260px; top: -80px; left: -70px; background: radial-gradient(circle, #0ea5a0, transparent 70%); }
  .blob-2 { width: 300px; height: 300px; bottom: -100px; right: -90px; background: radial-gradient(circle, #6b7fd7, transparent 70%); opacity: 0.35; }
  .blob-3 { width: 180px; height: 180px; top: 40%; right: -60px; background: radial-gradient(circle, #ffd166, transparent 70%); opacity: 0.25; }

  @media (max-width: 760px) {
    .blob { display: none; }
    body::before { display: none; }
  }

  .stage {
    width: 100%;
    max-width: 900px;
    height: 100%;
    max-height: 880px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }



  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 22px;
    border: 1px solid var(--line);
    box-shadow:
      0 1px 2px rgba(28, 37, 65, 0.04),
      0 20px 48px -16px rgba(28, 37, 65, 0.18);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    background: var(--ink);
    background: linear-gradient(135deg, #1c2541 0%, #263258 100%);
    color: #fff;
    flex-shrink: 0;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #0b7a76);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(14, 165, 160, 0.35);
  }

  .header-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    line-height: 1.2;
    min-width: 0;
  }

  .header-text .title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-text .subtitle {
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.62);
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 6px 12px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34e0b0;
    box-shadow: 0 0 0 3px rgba(52, 224, 176, 0.25);
  }

  .frame-wrap {
    position: relative;
    flex: 1;
    background: var(--paper);
  }

  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  footer {
    text-align: center;
    padding: 10px 0 2px;
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }

  @media (max-width: 480px) {
    body { padding: 0; }
    .stage { max-height: 100%; }
    .card { border-radius: 0; border: none; }
    header { padding: 14px 16px; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="stage">
    <div class="card">
      <header>
        <div class="avatar">AI</div>
        <div class="header-text">
          <span class="title">AI 학습 어시스턴트</span>
          <span class="subtitle">수업 도우미 · Copilot Studio</span>
        </div>
        <div class="status"><span class="dot"></span>온라인</div>
      </header>
      <div class="frame-wrap">
        <iframe
          src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_bot_OxrdOv/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
          frameborder="0"
          allow="microphone"
        ></iframe>
      </div>
    </div>
    <footer>이 대화는 수업용 AI 에이전트로 진행됩니다</footer>
  </div>
</body>
</html>
